<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>完納・EDI作業画面</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f6;color:#18313f;font-family:system-ui,sans-serif;letter-spacing:0}
    main{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #cbd7df;border-radius:8px;padding:32px;box-shadow:0 8px 26px rgba(31,61,78,.1)}
    h1{margin:0 0 8px;font-size:26px}p{margin:0;color:#59707e}
    .screens{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0 18px}
    .screen{padding:18px 14px;border:1px solid #c7d4dc;border-radius:6px;background:#f7fafb;text-align:center;font-weight:700}
    .screen small{display:block;margin-bottom:5px;color:#687d89;font-weight:500}
    button{width:100%;min-height:64px;border:0;border-radius:6px;background:#086d9d;color:#fff;font:700 20px system-ui,sans-serif;cursor:pointer}
    button:hover{background:#075c84}button:disabled{opacity:.6;cursor:wait}
    button:focus-visible{outline:3px solid #0b92cc;outline-offset:3px}
    .status{min-height:24px;margin-top:14px;text-align:center;font-size:13px;color:#815a12}.status.ready{color:#187044}.status.error{color:#aa261e}
    @media(max-width:520px){main{padding:22px}.screens{grid-template-columns:1fr}.screen{padding:12px}h1{font-size:22px}}
  </style>
  <script defer src="edi_completion_workspace_page.js"></script>
</head>
<body>
  <main>
    <h1>完納・EDI作業画面</h1>
    <p>同じChromeプロフィールに作業画面を並べて開きます。</p>
    <div class="screens">
      <div class="screen"><small>左画面</small>完納処理待ち</div>
      <div class="screen"><small>右画面</small>トヨタWG共通EDI</div>
    </div>
    <button id="openWorkspace" type="button">2画面を開く</button>
    <div id="workspaceStatus" class="status" role="status">連携拡張機能を確認中</div>
  </main>
</body>
</html>
